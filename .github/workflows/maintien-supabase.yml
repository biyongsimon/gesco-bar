# Maintient le projet Supabase (forfait gratuit) actif : Supabase met en pause un projet
# sans activité pendant 7 jours. Cette tâche fait une petite requête deux fois par jour.
# La clé utilisée est la clé publique de l'application (déjà visible dans le site), pas une clé secrète.
name: Maintien Supabase
on:
  schedule:
    - cron: "17 5,17 * * *"   # 6 h 17 et 18 h 17 (heure de Douala)
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête légère vers la base
        run: |
          curl -fsS -X POST "https://tkiuepleshsvptranoik.supabase.co/functions/v1/gesco-admin" \
            -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_GF4euX-Zbx3Bve-WSkgBWA_u4JoBY6w" \
            -H "Authorization: Bearer sb_publishable_GF4euX-Zbx3Bve-WSkgBWA_u4JoBY6w" \
            -d '{"action":"admin_setup_open"}'
