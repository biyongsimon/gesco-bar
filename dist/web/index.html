<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c3c">
<meta name="description" content="GesCo Bar : tickets par serveuse, caisse, stock et reliquats pour les bars et snacks.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>GesCo Bar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : une colonne tactile pour la serveuse, un tableau de bord à onglets pour la caisse.
   Couleurs : vert bouteille (marque), ambre bière (action), neutres légèrement verdis. */
:root{
  --bg:#f3f6f3; --surface:#ffffff; --sunk:#e9efea; --ink:#13201a; --muted:#5b6a62; --line:#dbe3dd;
  --brand:#0f5c3c; --brand-ink:#ffffff; --amber:#c98a12; --amber-soft:#fbf0d9;
  --ok:#17804a; --ok-soft:#e1f3e8; --warn:#a8650b; --warn-soft:#fbecd3; --bad:#b4302a; --bad-soft:#f8e1df;
  --shadow:0 1px 2px rgba(15,40,28,.06),0 4px 14px rgba(15,40,28,.06);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --logo-shadow:drop-shadow(0 1px 1.5px rgba(4,40,48,.35));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1411; --surface:#141f1a; --sunk:#0f1915; --ink:#e7efe9; --muted:#93a59b; --line:#25332c;
  --brand:#38b87a; --brand-ink:#06150e; --amber:#f0b43c; --amber-soft:#3a2c10;
  --ok:#4fd08b; --ok-soft:#123222; --warn:#f2b155; --warn-soft:#3a2a10; --bad:#ff7b72; --bad-soft:#3d1715;
  --shadow:0 1px 2px rgba(0,0,0,.4); --logo-shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1411; --surface:#141f1a; --sunk:#0f1915; --ink:#e7efe9; --muted:#93a59b; --line:#25332c;
  --brand:#38b87a; --brand-ink:#06150e; --amber:#f0b43c; --amber-soft:#3a2c10;
  --ok:#4fd08b; --ok-soft:#123222; --warn:#f2b155; --warn-soft:#3a2a10; --bad:#ff7b72; --bad-soft:#3d1715;
  --shadow:0 1px 2px rgba(0,0,0,.4); --logo-shadow:none; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
#app{max-width:1080px;margin:0 auto;padding-block:12px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:20px;letter-spacing:-.01em}
h3{font-size:12px;font-family:var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.mu{color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1 1 160px;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.sub{background:var(--sunk);border-radius:10px;padding:10px 12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=tel],input:not([type]),select{
  width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.btn{min-height:46px;padding:10px 16px;border-radius:10px;border:1px solid transparent;background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.amber{background:var(--amber);color:#1d1404}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.bad{background:transparent;border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.amber{background:var(--amber-soft);color:var(--warn)}
.pill.brand{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:800 18px var(--display);flex:none}
.who>div>b{display:block;font-size:16px;line-height:1.2}
.brandmark{font:800 20px var(--display);letter-spacing:-.02em;color:var(--brand)}
.brandmark span{color:var(--amber)}

/* Indicateurs */
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.kpi .v{font:800 21px/1.15 var(--display);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi.hl{border-color:color-mix(in srgb,var(--amber) 60%,transparent);background:var(--amber-soft)}
.kpi.alert{border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:var(--bad-soft)}

/* Onglets */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:thin}
.tabs button{flex:none;min-height:40px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .dot{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;margin-left:6px}

/* Tickets */
.tk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.tk.open{border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.tk-h{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:58px;background:none;border:0;text-align:left;cursor:pointer}
.tk-h .nm{flex:1;min-width:0}
.tk-h .nm b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-h .tt{font:800 16px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{width:22px;height:22px;flex:none;color:var(--muted);transition:transform .15s}
.tk.open .chev{transform:rotate(90deg)}
.tk-b{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.prow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px}
.prow.on{background:color-mix(in srgb,var(--amber) 14%,transparent)}
.prow .pn{flex:1;min-width:0}
.prow .pn b{display:block;font-weight:600}
.cat{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:6px 8px 0}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:22px;font-weight:700;cursor:pointer;line-height:1}
.stepper button.plus{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.stepper input{width:52px;min-height:44px;text-align:center;padding:4px;font-weight:700}
.lines .ln{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:10px}
.total b{font:800 22px var(--display);font-variant-numeric:tabular-nums}
.bills{display:flex;gap:6px;flex-wrap:wrap}
.bills button{min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.bills button.on{border-color:var(--amber);background:var(--amber-soft)}
.note{border-radius:10px;padding:10px 12px;font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.info{background:var(--sunk);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:14px;background:var(--surface)}
.chip.owe{border-color:color-mix(in srgb,var(--warn) 60%,transparent);color:var(--warn);background:var(--warn-soft)}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:none;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.list>*+*{border-top:1px solid var(--line)}
.li{padding:10px 0;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.li .grow{flex:1 1 180px;min-width:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* Graphiques */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:14px;background:var(--sunk);border-radius:7px;overflow:hidden}
.bar .fl{height:100%;background:var(--brand);border-radius:7px}
.bar.cur .fl{background:var(--amber)}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px;border-bottom:1px solid var(--line)}
.cols div{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.cols div.cur{background:var(--amber);opacity:1}

/* Connexion */
.login{max-width:440px;margin:4vh auto 0;display:flex;flex-direction:column;gap:16px}
.hero{padding:6px 2px}
.hero .brandmark{font-size:34px}
.hero p{margin:6px 0 0;color:var(--muted)}
.who-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.who-pick button{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.who-pick button span{font-size:12px;color:var(--muted);font-weight:600}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:6px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots i.f{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:60px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:700 24px var(--display);cursor:pointer}
.pad button.k2{font:600 15px var(--body);color:var(--muted)}
.demo{border:1px dashed color-mix(in srgb,var(--amber) 70%,transparent);background:var(--amber-soft);border-radius:var(--r);padding:12px;font-size:14px}
.code-big{font:800 34px var(--display);letter-spacing:.12em;text-align:center;color:var(--brand)}

/* Fenêtres, messages */
.scrim{position:fixed;inset:0;background:rgba(5,12,9,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--surface);border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.receipt{background:#fff;color:#111;border-radius:10px;padding:16px;font:14px/1.5 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;border:1px dashed #999}
.receipt hr{border:0;border-top:1px dashed #999;margin:8px 0}
.receipt .c{text-align:center}
.receipt .k{font-size:24px;font-weight:800;letter-spacing:3px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(92vw,480px);padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.err{background:var(--bad);color:#fff}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.net i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.net.off i{background:var(--bad)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.qr svg{display:block;margin:6px auto;max-width:100%;height:auto}
/* Signature BISMO Agency : logo détouré, lisible sur les deux thèmes, apparition animée */
.bismo{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0}
.bismo small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bismo .lg{position:relative;width:min(220px,62vw);aspect-ratio:520/208}
.bismo.anim small{animation:fadeUp .6s calc(.55s - var(--el,0ms)) both}.bismo.anim .lg{animation:logoIn .9s cubic-bezier(.2,.8,.2,1) calc(0s - var(--el,0ms)) both}
.bismo .lg img{width:100%;height:100%;display:block;filter:var(--logo-shadow)}
.bismo .lg::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);background-size:250% 100%;
  -webkit-mask:var(--logo-mask) center/contain no-repeat;mask:var(--logo-mask) center/contain no-repeat;opacity:0}
.bismo.anim .lg::after{opacity:1;animation:shine 1.6s calc(.9s - var(--el,0ms)) ease-out both}
.bismo.mini{flex-direction:row;justify-content:center;gap:10px;margin:28px 0 4px}
.bismo.mini .lg{width:96px}.bismo.mini.anim .lg{animation:fadeUp .6s calc(.3s - var(--el,0ms)) both}.bismo.mini.anim .lg::after{animation:shine 2.2s calc(1s - var(--el,0ms)) ease-out both}
.bismo.mini small{letter-spacing:.08em}.bismo.mini.anim small{animation:fadeUp .6s calc(.2s - var(--el,0ms)) both}
@keyframes logoIn{from{opacity:0;transform:translateY(10px) scale(.92);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shine{from{background-position:120% 0}to{background-position:-30% 0}}
.theme-btn{display:inline-flex;align-items:center;gap:6px}
.theme-btn svg{width:18px;height:18px}
.report{background:#fff;color:#111;border-radius:10px;padding:16px;font-size:13px}
.report h2{color:#111}.report table{font-size:12px}.report th,.report td{border-color:#ddd;color:#111}
.report .mu{color:#555}.report .kv{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:5px 0}
@media print{body.print-report #app>*:not(.scrim){display:none!important}body.print-report .scrim{position:static;background:none;padding:0;display:block}
  body.print-report .sheet{max-height:none;overflow:visible;max-width:none;padding:0}body.print-report .noprint{display:none!important}}
.receipt .qr{max-width:120px;margin:0 auto}
.poster{text-align:center}
@media print{body:not(.print-report) *{visibility:hidden}.printable,.printable *{visibility:visible}.printable{position:fixed;left:0;top:0;border:0;background:#fff;color:#000}
  .receipt.printable{width:58mm;padding:2mm}.poster.printable{width:100%;padding:12mm}}
</style>
</head>

<script>window.GESCO_CONFIG = { mode: /[?&]demo\b/.test(location.search) ? "demo" : "live", url: "https://tkiuepleshsvptranoik.supabase.co", key: "sb_publishable_GF4euX-Zbx3Bve-WSkgBWA_u4JoBY6w" };</script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";
/* ═══════════════ Outils ═══════════════ */
const CFG = window.GESCO_CONFIG;
const $app = document.getElementById("app");
const F = n => Math.round(Number(n) || 0).toLocaleString("fr-FR").replace(/[  ]/g, " ") + " FCFA";
const Fs = n => Math.round(Number(n) || 0).toLocaleString("fr-FR").replace(/[  ]/g, " ");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
  "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c == "x" ? r : (r & 3 | 8)).toString(16); }));
const bizErr = m => { const e = new Error(m); e.biz = true; return e; };
const hm = iso => iso ? new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "";
const dfr = (d, o) => new Date(String(d).length <= 10 ? d + "T12:00:00" : d).toLocaleDateString("fr-FR", o || { weekday: "short", day: "numeric", month: "short" });

/* ═══════════════ Moteur EN LIGNE (Supabase) ═══════════════ */
function LiveBackend() {
  const sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "gesco-auth" } });
  const listeners = []; let channel = null, barId = null;
  const netMsg = m => /fetch|network|load failed|timeout|offline/i.test(m || "");
  const toErr = e => { const m = (e && (e.message || e.error_description)) || "Erreur inconnue."; const x = bizErr(netMsg(m) ? "Connexion impossible. Vérifiez internet." : m); if (netMsg(m)) x.net = true;
    if (/JWT|session invalide|not authenticated/i.test(m)) x.auth = true; return x; };
  async function fn(action, body, auth) {
    const headers = { "Content-Type": "application/json", apikey: CFG.key };
    if (auth) { const { data } = await sb.auth.getSession(); if (data.session) headers.Authorization = "Bearer " + data.session.access_token; }
    let r; try { r = await fetch(CFG.url + "/functions/v1/gesco-admin", { method: "POST", headers, body: JSON.stringify({ action, ...body }) }); }
    catch (e) { const x = bizErr("Connexion impossible. Vérifiez internet."); x.net = true; throw x; }
    const j = await r.json().catch(() => ({ error: "Réponse invalide du serveur." })); if (!r.ok || j.error) throw bizErr(j.error || "Erreur serveur."); return j;
  }
  const q = async p => { const { data, error } = await p; if (error) throw toErr(error); return data; };
  function subscribe(bid) {
    if (channel && barId === bid) return; if (channel) sb.removeChannel(channel); barId = bid;
    channel = sb.channel("bar-" + bid);
    ["tickets", "ticket_items", "holdings", "vouchers", "remittances", "products", "service_days"].forEach(t =>
      channel.on("postgres_changes", { event: "*", schema: "public", table: t, filter: "bar_id=eq." + bid }, () => listeners.forEach(f => f())));
    channel.subscribe();
  }
  return {
    mode: "live",
    async init() { const { data } = await sb.auth.getSession(); return !!data.session; },
    staffList: code => fn("staff_list", { code }),
    async pinLogin(code, staff_id, pin) { const s = await fn("pin_login", { code, staff_id, pin }); const { error } = await sb.auth.setSession(s); if (error) throw toErr(error); },
    async ownerLogin(email, password) { const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
      if (error) throw bizErr(/invalid/i.test(error.message) ? "E-mail ou mot de passe incorrect." : toErr(error).message); },
    async register(f) { const r = await fn("register", f); await this.ownerLogin(f.email, f.password); return r; },
    async logout() { if (channel) sb.removeChannel(channel); channel = null; barId = null; await sb.auth.signOut(); },
    async load() {
      const { data: sd } = await sb.auth.getSession(); if (!sd.session) { const e = bizErr("Session expirée."); e.auth = true; throw e; }
      const uid = sd.session.user.id;
      const [staff, bars, products, days] = await Promise.all([
        q(sb.from("staff").select("id,name,role,active,user_id").order("name")),
        q(sb.from("bars").select("id,name,code,city,cash_cap,low_stock,legal_name,niu,id_doc_path,kyc_status").limit(1)),
        q(sb.from("products").select("*").order("sort")),
        q(sb.from("service_days").select("*").eq("status", "open").limit(1))]);
      const meRow = staff.find(s => s.user_id === uid && s.active); if (!meRow || !bars.length) { const e = bizErr("Compte non rattaché à un bar ou désactivé."); e.auth = true; throw e; }
      const me = { id: meRow.id, name: meRow.name, role: meRow.role }, cs = me.role === "caisse", day = days[0] || null;
      let tq = sb.from("tickets").select("*, ticket_items(product_id,qty,unit_price)").order("created_at", { ascending: false }).limit(600);
      tq = tq.or("status.in.(draft,sent,cashed),change_status.eq.pending" + (day ? ",day_id.eq." + day.id : ""));
      const jobs = [q(tq), q(sb.from("holdings").select("waitress_id,product_id,qty")), q(sb.from("vouchers").select("*").order("issued_at", { ascending: false }).limit(200)),
        day ? q(sb.from("remittances").select("*").eq("day_id", day.id).order("created_at", { ascending: false })) : Promise.resolve([])];
      if (cs) jobs.push(q(sb.from("audit_log").select("*").order("created_at", { ascending: false }).limit(200)),
        q(sb.from("stock_moves").select("*").order("created_at", { ascending: false }).limit(150)),
        q(sb.from("service_days").select("*").eq("status", "closed").order("closed_at", { ascending: false }).limit(30)));
      const [tickets, holdings, vouchers, remits, audit = [], moves = [], closed = []] = await Promise.all(jobs);
      subscribe(bars[0].id);
      return { bar: bars[0], me, staff: staff.map(s => ({ id: s.id, name: s.name, role: s.role, active: s.active })), products, day,
        tickets: tickets.map(t => { const { ticket_items, ...r } = t; return { ...r, items: ticket_items || [] }; }), holdings, vouchers, remits, audit, moves, days: closed };
    },
    async rpc(name, args) { const { data, error } = await sb.rpc(name, args || {}); if (error) { const e = toErr(error); if (/non soldé/.test(error.message)) e.pending = true; throw e; } return data; },
    staffCreate: (name, role, pin) => fn("staff_create", { name, role, pin }, true),
    async uploadDoc(file) {
      const { data: bars } = await sb.from("bars").select("id").limit(1); if (!bars || !bars.length) throw bizErr("Bar introuvable.");
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
      const path = `${bars[0].id}/piece-identite-${Date.now()}.${ext}`;
      const { error } = await sb.storage.from("kyc").upload(path, file, { contentType: file.type, upsert: false });
      if (error) throw bizErr(/size|large/i.test(error.message) ? "Fichier trop lourd (5 Mo maximum)." : "Envoi impossible : " + error.message); return path;
    },
    onChange(f) { listeners.push(f); }
  };
}

/* File d'attente hors ligne : les gestes de service sont appliqués tout de suite à l'écran, puis envoyés dans l'ordre */
const QUEUE = new Set(["gb_ticket_create", "gb_ticket_set_qty", "gb_ticket_send", "gb_ticket_cash", "gb_ticket_delete"]);
function applyLocal(op) {
  const a = op.a, t = S.tickets.find(x => x.id === (a.p_ticket || a.p_id));
  if (op.n === "gb_ticket_create") { if (!t) S.tickets.unshift({ id: a.p_id, number: null, client_label: a.p_client, waitress_id: S.me.id, day_id: S.day && S.day.id, status: "draft", total: 0, items: [],
    change_due: 0, change_status: "none", corrections: 0, cancel_requested: false, created_at: new Date().toISOString(), _local: 1 }); return; }
  if (!t) return; t._local = 1;
  if (op.n === "gb_ticket_set_qty") { if (!["draft", "sent"].includes(t.status)) return; const p = S.products.find(x => x.id === a.p_product); if (!p) return;
    let it = t.items.find(i => i.product_id === a.p_product); const cur = it ? it.qty : 0, d = a.p_qty - cur; if (!d) return;
    if (!a.p_qty) t.items = t.items.filter(i => i !== it); else if (!it) t.items.push({ product_id: p.id, qty: a.p_qty, unit_price: p.price }); else it.qty = a.p_qty;
    if (isCounter(t)) p.stock -= d;
    else { let h = S.holdings.find(x => x.waitress_id === t.waitress_id && x.product_id === p.id); if (!h) S.holdings.push(h = { waitress_id: t.waitress_id, product_id: p.id, qty: 0 }); h.qty -= d; }
    t.total = sum(t.items, i => i.qty * i.unit_price); }
  if (op.n === "gb_ticket_send" && t.status === "draft" && t.total > 0) t.status = "sent";
  if (op.n === "gb_ticket_cash" && (t.status === "sent" || (isCounter(t) && t.status === "draft" && t.total > 0))) { const r = a.p_method === "cash" ? (a.p_received ?? t.total) : t.total;
    Object.assign(t, { status: isCounter(t) ? "paid" : "cashed", pay_method: a.p_method, received: r, change_due: r - t.total, change_status: r > t.total ? "pending" : "none" }); }
  if (op.n === "gb_ticket_delete") { if (isCaisse() || t.status === "draft") { t.items.forEach(i => { if (isCounter(t)) { const p = S.products.find(x => x.id === i.product_id); if (p) p.stock += i.qty; return; }
      const h = S.holdings.find(x => x.waitress_id === t.waitress_id && x.product_id === i.product_id); if (h) h.qty += i.qty; }); t.status = "cancelled"; }
    else if (t.status === "sent") t.cancel_requested = true; }
}
const saveOutbox = () => LS.set(OBX, V.outbox);
let flushing = false;
async function flush() {
  if (flushing) return; flushing = true; let changed = false;
  try {
    while (V.outbox.length) {
      const op = V.outbox[0];
      try { await B.rpc(op.n, op.a); V.outbox.shift(); saveOutbox(); V.online = true; changed = true; }
      catch (e) { if (e.net) { V.online = false; break; } if (e.auth) { V.outbox = []; saveOutbox(); break; } V.outbox.shift(); saveOutbox(); changed = true; toast(e.message, "err"); }
    }
  } finally { flushing = false; }
  if (changed) refreshSoon(50); else render();
}
async function call(n, a) {
  if (QUEUE.has(n)) { V.outbox.push({ n, a }); saveOutbox(); applyLocal({ n, a }); render(); flush(); return; }
  return B.rpc(n, a);
}

  finally { loading = false; }

}

async function run(fn) {
  if (V.busy) return; V.busy = true; render();
  try { await fn(); } catch (e) { if (e.auth) { await logout(true); } toast(e.message || String(e), "err"); }
  finally { V.busy = false; render(); }
}
const ask = (title, text, ok, a, d, danger) => { V.modal = { type: "confirm", title, text, ok, a, d, danger }; render(); };
const num = k => { const v = String(V.f[k] ?? "").replace(/\s/g, ""); return v === "" ? null : Math.trunc(+v); };

  try { await B.pinLogin(V.code, V.pick.id, V.pin); } catch (e) { V.pin = ""; throw e; } await enterApp(); });

A.register = () => run(async () => {
  const f = { bar_name: V.f.r_bar, city: V.f.r_city, owner_name: V.f.r_name, email: V.f.r_email, password: V.f.r_pw, pin: V.f.r_pin };
  if (!f.bar_name || !f.owner_name || !f.email || !f.password || !f.pin) throw bizErr("Remplissez tous les champs.");
  const niu = (V.f.r_niu || "").replace(/\s/g, "").toUpperCase();
  if (niu && !/^[PM]\d{12}[A-Z]$/.test(niu)) throw bizErr("NIU invalide : 14 caractères, P ou M, 12 chiffres, puis une lettre (ex. M012345678901A). Laissez vide si vous ne l’avez pas.");
  const r = await B.register(f); V.code = r.code; LS.set("gesco-code", r.code); V.regDone = r.code; V.f.r_pw = ""; await enterApp();
  if ((V.f.r_legal || "").trim() || niu) { try { await B.rpc("gb_bar_identity", { p_legal_name: V.f.r_legal || "", p_niu: niu, p_doc_path: null }); await refresh(); } catch (e) { toast(e.message, "err"); } }
  V.modal = { type: "welcome", code: r.code };
});

/* ═══════════════ Rendu : connexion ═══════════════ */
function vLogin() {
  const demo = CFG.mode === "demo";
  const tabs = `<div class="seg" role="tablist">${[["staff", "Personnel"], ["owner", "Propriétaire"], ["reg", "Créer mon bar"]].map(([k, l]) =>
    `<button role="tab" aria-selected="${V.ltab === k}" class="${V.ltab === k ? "on" : ""}" data-a="ltab" data-v="${k}">${l}</button>`).join("")}</div>`;
  let body = "";
  if (V.ltab === "staff") {
    if (!V.list) body = `<div class="card stack"><label class="f" for="code">Code du bar<input id="code" data-k="code" value="${esc(V.f.code ?? V.code)}" autocapitalize="characters" autocomplete="off" placeholder="Ex. 7K2QPA" data-enter="loadStaff"></label>
      <button class="btn wide" data-a="loadStaff" ${V.busy ? "disabled" : ""}>${V.busy ? '<span class="spin"></span>' : "Continuer"}</button>
      <p class="mu" style="margin:0">Le code est affiché dans l’espace caisse, onglet Équipe.</p></div>`;
    else if (!V.pick) {
      const grp = r => V.list.staff.filter(s => s.role === r).map(s => `<button data-a="pick" data-id="${s.id}">${esc(s.name)}<span>${r === "caisse" ? "Caisse" : "Serveuse"}</span></button>`).join("");
      body = `<div class="card stack"><div class="between"><div><h3>${esc(V.code)}</h3><b>${esc(V.list.bar)}</b></div><button class="btn ghost sm" data-a="changeBar">Changer de bar</button></div>
        <p class="mu" style="margin:0">Touchez votre nom.</p><div class="who-pick">${grp("serveuse")}${grp("caisse")}</div></div>`;
    } else body = `<div class="card stack" style="text-align:center"><div class="between"><button class="btn ghost sm" data-a="unpick">← Retour</button><span class="mu">${esc(V.list.bar)}</span></div>
        <div><div class="avatar" style="margin:0 auto 6px">${esc(V.pick.name[0])}</div><b style="font-size:18px">${esc(V.pick.name)}</b><div class="mu">Saisissez votre PIN</div></div>
        <div class="pin-dots" aria-label="${V.pin.length} chiffres saisis">${Array.from({ length: Math.max(4, V.pin.length) }, (_, i) => `<i class="${i < V.pin.length ? "f" : ""}"></i>`).join("")}</div>
        <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => `<button data-a="pinKey" data-k="${k}">${k}</button>`).join("")}
        <button class="k2" data-a="pinKey" data-k="del" aria-label="Effacer">Effacer</button><button data-a="pinKey" data-k="0">0</button>
        <button class="k2" data-a="pinGo" style="background:var(--brand);color:var(--brand-ink);font-weight:700" ${V.busy ? "disabled" : ""}>${V.busy ? '<span class="spin"></span>' : "Entrer"}</button></div></div>`;
  } else if (V.ltab === "owner") {
    body = `<div class="card stack"><label class="f" for="email">E-mail<input id="email" type="email" data-k="email" value="${val("email")}" autocomplete="username"></label>
      <label class="f" for="pw">Mot de passe<input id="pw" type="password" data-k="pw" value="${val("pw")}" autocomplete="current-password" data-enter="ownerGo"></label>
      <button class="btn wide" data-a="ownerGo" ${V.busy ? "disabled" : ""}>${V.busy ? '<span class="spin"></span>' : "Se connecter"}</button>

      <label class="f" for="r_pw">Mot de passe (8 caractères minimum)<input id="r_pw" type="password" data-k="r_pw" value="${val("r_pw")}" autocomplete="new-password"></label>
      <label class="f" for="r_pin">Votre PIN caisse (4 à 6 chiffres)<input id="r_pin" type="tel" inputmode="numeric" maxlength="6" data-k="r_pin" value="${val("r_pin")}"></label>

      <label class="f" for="r_legal">Raison sociale<input id="r_legal" data-k="r_legal" value="${val("r_legal")}" placeholder="Ex. SNACK LE MANGUIER SARL"></label>
      <label class="f" for="r_niu">NIU (numéro d’identifiant unique DGI)<input id="r_niu" data-k="r_niu" value="${val("r_niu")}" placeholder="Ex. M012345678901A" autocapitalize="characters" maxlength="16"></label></div>

function installBox() {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;

  return `<p class="mu" style="margin:0;text-align:center">${ios ? "Pour l’installer : touchez Partager, puis « Sur l’écran d’accueil »." : "Pour l’installer : menu ⋮ de Chrome, puis « Ajouter à l’écran d’accueil »."}</p>`;

/* ═══════════════ Rendu : composants ═══════════════ */
function header(sub) {
  const pend = V.outbox.length;
  return `<div class="top"><div class="who"><div class="avatar">${esc(S.me.name[0])}</div><div><b>${esc(S.me.name)}</b><span class="mu">${sub}</span></div></div>
    <div class="row"><span class="net ${V.online ? "" : "off"}"><i></i>${V.online ? (pend ? `Envoi de ${pend} action(s)…` : "En ligne") : `Hors ligne${pend ? ` · ${pend} en attente` : ""}`}</span>
    ${CFG.mode === "demo" && isCaisse() ? `<button class="btn ghost sm" data-a="resetDemo">Réinitialiser la démo</button>` : ""}
    ${themeBtn()}<button class="btn ghost sm" data-a="logout">Déconnexion</button></div></div>`;
}
function kpi(l, v, cls, extra) { return `<div class="kpi ${cls || ""}"><div class="l">${l}</div><div class="v">${v}</div>${extra ? `<div class="mu">${extra}</div>` : ""}</div>`; }
function statusPill(t) {
  if (t.status === "draft") return `<span class="pill">Brouillon</span>`;
  if (t.status === "sent") return t.cancel_requested ? `<span class="pill bad">Annulation demandée</span>` : `<span class="pill brand">Envoyé</span>`;
  if (t.status === "cashed") return t.pay_method === "momo" ? `<span class="pill amber">MoMo à confirmer</span>` : `<span class="pill amber">Espèces à remettre</span>`;
  if (t.status === "paid") return t.change_status === "pending" ? `<span class="pill warn">Reliquat à rendre</span>` : `<span class="pill ok">Payé ✓</span>`;
  return `<span class="pill">Annulé</span>`;
}
function lines(t) { return `<div class="lines">${t.items.map(i => `<div class="ln"><span>${i.qty} × ${esc(prodName(i.product_id))}</span><span class="num">${F(i.qty * i.unit_price)}</span></div>`).join("") || '<span class="mu">Aucune boisson.</span>'}</div>`; }
function changeBlock(t) {
  if (!t.change_due || t.change_status === "none") return t.received != null && t.pay_method === "cash" ? `<div class="mu">Reçu du client : ${F(t.received)} (compte exact)</div>` : "";
  const head = `<div class="ln between"><span>Reçu du client</span><b class="num">${F(t.received)}</b></div>`;
  if (t.change_status === "pending") return `<div class="note warn">${head}<div class="between"><span>Reliquat à rendre</span><b class="num">${F(t.change_due)}</b></div><div>${t.status === "paid" ? "La caisse doit remettre la monnaie ou un bon." : "Remettez l’argent à la caisse : elle rendra la monnaie ou un bon."}</div></div>`;
  if (t.change_status === "given") return `<div class="note ok">${head}<div class="between"><span>Monnaie remise par la caisse</span><b class="num">${F(t.change_due)}</b></div><div>Rendez-la au client.</div></div>`;
  const v = S.vouchers.find(x => x.id === t.voucher_id);
  return `<div class="note info">${head}<div class="between"><span>Bon de reliquat ${v ? esc(v.number) : ""}</span><b class="num">${F(t.change_due)}</b></div>
    ${v ? `<div class="row" style="margin-top:6px"><span>Code : <b class="num">${esc(v.code)}</b></span><button class="btn soft sm" data-a="showV" data-v="${v.id}">Voir le bon</button></div>` : ""}</div>`;
}
function editor(t) {
  const inT = new Map(t.items.map(i => [i.product_id, i.qty])), hmap = new Map(S.holdings.filter(h => h.waitress_id === t.waitress_id).map(h => [h.product_id, h.qty]));
  const q = (V.f["q_" + t.id] || "").toLowerCase().trim(), cat = V.f["cat_" + t.id] || "", counter = isCounter(t);
  const avail = S.products.filter(p => p.active || inT.has(p.id)), allCats = [...new Set(avail.map(p => p.category))];
  const ps = avail.filter(p => (!q || p.name.toLowerCase().includes(q)) && (!cat || p.category === cat || inT.has(p.id)));
  const row = p => { const n = inT.get(p.id) || 0, h = hmap.get(p.id) || 0, u = unitOf(p);
    const info = counter ? `stock : ${p.stock}` : h >= 0 ? `en main : ${h}` : `<span class="warn-t">${-h} à prendre à la caisse</span>`;
    return `<div class="prow ${n ? "on" : ""}"><div class="pn"><b>${esc(p.name)}</b><span class="mu num">${F(p.price)}${u ? " / " + esc(u) : ""} · ${info}</span></div>
      <div class="stepper"><button data-a="qty" data-t="${t.id}" data-p="${p.id}" data-d="-1" aria-label="Retirer une ${esc(p.name)}" ${n ? "" : "disabled"}>−</button>
      <input type="number" inputmode="numeric" min="0" value="${n}" data-qty="1" data-t="${t.id}" data-p="${p.id}" aria-label="Quantité ${esc(p.name)}">
      <button class="plus" data-a="qty" data-t="${t.id}" data-p="${p.id}" data-d="1" aria-label="Ajouter une ${esc(p.name)}">+</button></div></div>`; };
  const chosen = ps.filter(p => inT.has(p.id)), rest = ps.filter(p => !inT.has(p.id)), cats = [...new Set(rest.map(p => p.category))];
  return `${avail.length > 8 ? `<input id="q_${t.id}" data-k="q_${t.id}" value="${val("q_" + t.id)}" placeholder="Chercher une boisson…" autocomplete="off">` : ""}
    ${allCats.length > 1 ? `<div class="bills" role="group" aria-label="Catégories">${[["", "Tout"], ...allCats.map(c => [c, c])].map(([v, l]) => `<button data-a="cat" data-t="${t.id}" data-v="${esc(v)}" class="${cat === v ? "on" : ""}">${esc(l)}</button>`).join("")}</div>` : ""}
    <div>${chosen.length ? `<div class="cat">Dans ce ticket</div>${chosen.map(row).join("")}` : ""}
    ${cats.map(c => `<div class="cat">${esc(c)}</div>${rest.filter(p => p.category === c).map(row).join("")}`).join("")}
    ${!ps.length ? `<div class="empty">Aucune boisson ne correspond.</div>` : ""}</div>`;
}
function payBox(t) {
  const r = num("rcv_" + t.id), bills = [...new Set([t.total, ...[500, 1000, 2000, 5000, 10000].map(b => Math.ceil(t.total / b) * b)])].filter(b => b >= t.total).sort((a, b) => a - b).slice(0, 5);
  const ch = r != null && r >= t.total ? r - t.total : null;
  return `<div class="sub stack"><h3>Encaisser</h3>
    <div class="bills">${bills.map(b => `<button data-a="bill" data-t="${t.id}" data-v="${b}" class="${r === b ? "on" : ""}">${b === t.total ? "Compte exact" : Fs(b)}</button>`).join("")}</div>
    <label class="f" for="rcv_${t.id}">Billet reçu du client (FCFA)<input id="rcv_${t.id}" type="number" inputmode="numeric" data-k="rcv_${t.id}" value="${val("rcv_" + t.id)}" placeholder="${Fs(t.total)}"></label>
    ${ch ? `<div class="note warn between"><span>Reliquat à rendre au client</span><b class="num">${F(ch)}</b></div>` : r != null && r < t.total ? `<div class="note bad">Montant inférieur au total.</div>` : ""}
    <div class="row"><button class="btn amber grow" data-a="cash" data-t="${t.id}">Encaisser en espèces</button><button class="btn soft grow" data-a="momo" data-t="${t.id}">Mobile Money</button></div></div>`;
}
function ticket(t, opts = {}) {
  const open = !!V.open[t.id], editable = ["draft", "sent"].includes(t.status) && t.waitress_id === S.me.id;
  const meta = `${t.number ? "N°" + t.number : "Nouveau"} · ${opts.who ? esc(staffName(t.waitress_id)) + " · " : ""}${t.items.reduce((a, i) => a + i.qty, 0)} article(s)${t._local && V.outbox.length ? " · en cours d’envoi" : ""}`;
  let body = "";
  if (open) {
    if (editable) {
      body = editor(t) + `<div class="total"><span class="mu">Total</span><b>${F(t.total)}</b></div>`;
      if (t.cancel_requested) body += `<div class="note bad">Annulation demandée : en attente de la caisse.</div>`;
      if (t.status === "draft" && isCounter(t)) body += (t.total ? payBox(t) : "") + `<div class="row"><span class="mu grow">Vente au comptoir : le paiement est validé directement.</span><button class="btn bad sm" data-a="del" data-t="${t.id}">Supprimer</button></div>`;
      else if (t.status === "draft") body += `<div class="row"><button class="btn grow" data-a="send" data-t="${t.id}" ${t.total ? "" : "disabled"}>Envoyer à la caisse</button><button class="btn bad" data-a="del" data-t="${t.id}">Supprimer</button></div>`;
      else { if (!t.cancel_requested) body += payBox(t); body += `<div class="row"><span class="mu grow">Le client change d’avis ? Corrigez les quantités : chaque correction est tracée.</span>${t.cancel_requested && !isCaisse() ? "" : `<button class="btn bad sm" data-a="del" data-t="${t.id}">${isCaisse() ? "Supprimer" : "Annuler la commande"}</button>`}</div>`; }
    } else {
      body = lines(t) + `<div class="total"><span class="mu">Total${t.pay_method ? " · " + (t.pay_method === "momo" ? "Mobile Money" : "espèces") : ""}</span><b>${F(t.total)}</b></div>` + changeBlock(t);
      if (isCaisse() && t.status === "sent" && !isCounter(t)) body += `<div class="note info">Commande de ${esc(staffName(t.waitress_id))}. Seule la serveuse peut la modifier ; la caisse suit son évolution ici.</div>`;
      if (isCaisse() && t.status !== "cancelled") body += `<div class="row">${sold(t) ? `<button class="btn soft sm" data-a="reopen" data-t="${t.id}">Rouvrir pour modifier</button>` : ""}<button class="btn bad sm" data-a="del" data-t="${t.id}">Supprimer</button></div>`;
    }
  }
  return `<div class="tk ${open ? "open" : ""}"><button class="tk-h" data-a="tog" data-id="${t.id}" aria-expanded="${open}">${chev}<span class="nm"><b>${esc(t.client_label)}</b><span class="mu">${meta}</span></span>
    <span style="text-align:right"><span class="tt">${F(t.total)}</span><br>${statusPill(t)}</span></button>${open ? `<div class="tk-b">${body}</div>` : ""}</div>`;
}

/* ═══════════════ Rendu : serveuse ═══════════════ */
function vWaitress() {
  const mine = S.tickets.filter(t => t.waitress_id === S.me.id && t.status !== "cancelled");
  const today = mine.filter(t => S.day && t.day_id === S.day.id);
  const cashHand = sum(mine.filter(t => t.status === "cashed" && t.pay_method === "cash"), cashOf);
  const hold = S.holdings.filter(h => h.waitress_id === S.me.id && h.qty !== 0);
  const inHand = sum(hold, h => Math.max(0, h.qty)), owe = sum(hold, h => Math.max(0, -h.qty));
  const lists = { open: mine.filter(t => ["draft", "sent"].includes(t.status)), cash: mine.filter(t => t.status === "cashed" || (t.status === "paid" && t.change_status === "pending")), done: mine.filter(t => t.status === "paid" && t.change_status !== "pending") };
  const over = cashHand > S.bar.cash_cap;
  const L = lists[V.wf] || lists.open;
  return header(`Serveuse · ${esc(S.bar.name)}`) +
    `<div class="kpis">${kpi("Mes ventes du jour", F(sum(today.filter(sold), t => t.total)), "", `${today.filter(sold).length} ticket(s)`)}
    ${kpi("Espèces à remettre", F(cashHand), over ? "alert" : cashHand ? "hl" : "", over ? "Plafond dépassé : versez à la caisse" : `Plafond ${F(S.bar.cash_cap)}`)}
    ${kpi("Tickets en cours", lists.open.length)}${kpi("Bouteilles en main", inHand, owe ? "hl" : "", owe ? `${owe} à prendre à la caisse` : "")}</div>
    ${hold.length ? `<div class="card stack" style="margin-bottom:14px"><h3>Bouteilles en main</h3><div class="chips">${hold.map(h => h.qty > 0 ? `<span class="chip"><b class="num">${h.qty}</b> ${esc(prodName(h.product_id))}</span>`
      : `<span class="chip owe">À prendre à la caisse : <b class="num">${-h.qty}</b> ${esc(prodName(h.product_id))}</span>`).join("")}</div></div>` : ""}
    <div class="card" style="margin-bottom:14px"><label class="f" for="client">Nouveau ticket</label><div class="row" style="margin-top:6px"><input id="client" class="grow" data-k="client" value="${val("client")}" placeholder="Nom du client ou repère (ex. Table du fond)" data-enter="newT" autocomplete="off"><button class="btn" data-a="newT">Ouvrir le ticket</button></div></div>
    <div class="seg">${[["open", "En cours", lists.open.length], ["cash", "À remettre", lists.cash.length], ["done", "Terminés", lists.done.length]].map(([k, l, n]) => `<button class="${V.wf === k ? "on" : ""}" data-a="wf" data-v="${k}">${l} (${n})</button>`).join("")}</div>
    <div class="stack">${L.map(t => ticket(t)).join("") || `<div class="empty">${V.wf === "open" ? "Aucun ticket en cours. Saisissez le nom du client ci-dessus pour commencer." : "Rien ici pour le moment."}</div>`}</div>`;
}

/* ═══════════════ Rendu : caisse ═══════════════ */
function vCaisse() {
  const DT = dayT(), act = S.tickets.filter(t => t.status !== "cancelled");
  const toRecv = act.filter(t => t.status === "cashed"), pend = act.filter(t => t.change_status === "pending");
  const cancels = act.filter(t => t.cancel_requested), momo = toRecv.filter(t => t.pay_method === "momo");
  const vAct = S.vouchers.filter(v => v.status === "active"), low = S.products.filter(isLow);
  const alerts = cancels.length + momo.length + pend.length;
  const tabs = [["direct", "En direct", alerts], ["sales", "Ventes"], ["rev", "Revenus"], ["vouch", "Bons"], ["stock", "Stock", low.length], ["acc", "Compta"], ["team", "Équipe"], ["day", "Journée"], ["log", "Journal"]];
  let body = "";
  if (V.tab === "direct") body = cDirect(act, toRecv, pend, cancels, momo);
  else if (V.tab === "sales") body = cSales(DT);
  else if (V.tab === "rev") body = cRev();
  else if (V.tab === "vouch") body = cVouch(vAct);
  else if (V.tab === "stock") body = cStock(low);
  else if (V.tab === "team") body = cTeam();
  else if (V.tab === "day") body = cDay(DT);
  else if (V.tab === "acc") body = cAcc();
  else body = cLog();
  return header(`Caisse · ${esc(S.bar.name)} · code <b class="num">${esc(S.bar.code)}</b>`) +
    `<div class="kpis">${kpi("Ventes du jour", F(sum(DT.filter(sold), t => t.total)), "", `${DT.filter(sold).length} ticket(s)`)}
    ${kpi("Payé et validé", F(sum(DT.filter(t => t.status === "paid"), t => t.total)))}
    ${kpi("À recevoir", F(sum(toRecv, cashOf)), toRecv.length ? "hl" : "", "Espèces et MoMo chez les serveuses")}
    ${kpi("En service", F(sum(act.filter(t => t.status === "sent"), t => t.total)), "", `${act.filter(t => t.status === "sent").length} commande(s) envoyée(s)`)}
    ${kpi("Reliquats à rendre", pend.length ? F(sum(pend, t => t.change_due)) : "0", pend.length ? "alert" : "", pend.length ? `${pend.length} client(s)` : "")}
    ${kpi("Bons en circulation", F(sum(vAct, v => v.amount)), "", `${vAct.length} bon(s)`)}</div>
    <div class="tabs" role="tablist">${tabs.map(([k, l, n]) => `<button role="tab" aria-selected="${V.tab === k}" class="${V.tab === k ? "on" : ""}" data-a="tab" data-v="${k}">${l}${n ? `<span class="dot">${n}</span>` : ""}</button>`).join("")}</div>${body}`;
}
function cDirect(act, toRecv, pend, cancels, momo) {
  const ws = S.staff.filter(s => s.active && s.role === "serveuse");
  const todo = [
    ...cancels.map(t => `<div class="li"><div class="grow"><b>Annulation demandée</b> · ${esc(staffName(t.waitress_id))}<div class="mu">${esc(t.client_label)} · ${F(t.total)}</div></div><div class="row"><button class="btn sm" data-a="acceptCancel" data-t="${t.id}">Accepter</button><button class="btn ghost sm" data-a="rejectCancel" data-t="${t.id}">Refuser</button></div></div>`),
    ...momo.map(t => `<div class="li"><div class="grow"><b>Mobile Money à vérifier</b> · ${esc(staffName(t.waitress_id))}<div class="mu">${esc(t.client_label)} · N°${t.number} · ${F(t.total)}</div></div><button class="btn sm" data-a="momoOk" data-t="${t.id}">Paiement reçu</button></div>`),
    ...pend.map(t => `<div class="li"><div class="grow"><b>Reliquat de ${F(t.change_due)}</b> · ${esc(staffName(t.waitress_id))}<div class="mu">${esc(t.client_label)} · reçu ${F(t.received)} pour ${F(t.total)}</div></div>
      ${t.status === "paid" ? `<div class="row"><button class="btn sm" data-a="changeGiven" data-t="${t.id}">Monnaie remise</button><button class="btn soft sm" data-a="voucher" data-t="${t.id}">Pas de monnaie : émettre un bon</button></div>` : `<span class="mu">Validez d’abord le versement de la serveuse</span>`}</div>`)];
  const mineC = act.filter(t => t.waitress_id === S.me.id && t.status === "draft");
  const sent = act.filter(t => t.status === "sent" && !isCounter(t)).sort((a, b) => (a.sent_at || a.created_at) < (b.sent_at || b.created_at) ? -1 : 1);
  const opt = (arr, k, sel) => arr.map(x => `<option value="${x.id}" ${sel === x.id ? "selected" : ""}>${esc(x.name)}${k ? ` (stock ${x.stock})` : ""}</option>`).join("");
  return `<div class="stack">
    ${todo.length ? `<div class="card"><h3>À traiter maintenant</h3><div class="list">${todo.join("")}</div></div>` : ""}
    <div class="card"><h3>Versements des serveuses</h3><div class="list">${ws.map(w => {
      const c = toRecv.filter(t => t.waitress_id === w.id && t.pay_method === "cash"), amt = sum(c, cashOf), owe = S.holdings.filter(h => h.waitress_id === w.id && h.qty < 0);
      return `<div class="li" style="align-items:flex-start"><div class="grow"><b>${esc(w.name)}</b> <span class="mu">· espèces en main</span> <b class="num ${amt > S.bar.cash_cap ? "bad-t" : ""}">${F(amt)}</b>
        ${c.map(t => `<div class="mu">N°${t.number} ${esc(t.client_label)} · total ${F(t.total)}${t.change_due ? ` · perçu ${F(t.received)}, reliquat ${F(t.change_due)}` : ""}</div>`).join("")}

    <h3 style="color:#333;margin-top:14px">Recettes jour par jour</h3><table><tr><th>Jour</th><th>Tickets</th><th>Espèces</th><th>MoMo</th><th>Total</th></tr>${r.by_day.map(d => `<tr><td>${new Date(d.day + "T12:00:00").toLocaleDateString("fr-FR")}</td><td>${d.tickets}</td><td>${F(d.cash)}</td><td>${F(d.momo)}</td><td>${F(d.total)}</td></tr>`).join("") || '<tr><td colspan="5">Aucune vente</td></tr>'}
      <tr><th>Total</th><th>${r.tickets}</th><th>${F(r.ca_cash)}</th><th>${F(r.ca_momo)}</th><th>${F(r.ca)}</th></tr></table>
    <h3 style="color:#333;margin-top:14px">Dépenses</h3><table><tr><th>Date</th><th>Catégorie</th><th>Détail</th><th>Montant</th></tr>${r.depenses.map(e => `<tr><td>${new Date(e.day + "T12:00:00").toLocaleDateString("fr-FR")}</td><td>${esc(e.category)}</td><td>${esc(e.label || "")}</td><td>${F(e.amount)}</td></tr>`).join("") || '<tr><td colspan="4">Aucune</td></tr>'}</table>
    <p class="mu" style="margin-top:14px">Rapport généré automatiquement par GesCo Bar, un produit de BISMO Agency. Document d’aide à la gestion : il ne remplace pas les états financiers certifiés.</p></div>`;
}
function accCsv(r) {
  const rows = [["Date", "Type", "Catégorie", "Détail", "Mode de paiement", "Recette (FCFA)", "Dépense (FCFA)"]];
  r.by_day.forEach(d => { if (d.cash) rows.push([d.day, "Recette", "Ventes", `${d.tickets} ticket(s)`, "Espèces", d.cash, ""]); if (d.momo) rows.push([d.day, "Recette", "Ventes", "", "Mobile Money", d.momo, ""]); });
  r.achats_detail.forEach(a => rows.push([a.day, "Dépense", "Achats de boissons", `${a.qty} × ${a.produit}`, "", "", a.total]));
  r.depenses.forEach(e => rows.push([e.day, "Dépense", e.category, e.label || "", { cash: "Espèces", momo: "Mobile Money", banque: "Banque" }[e.method] || "", "", e.amount]));
  rows.sort((a, b) => a[0] === "Date" ? -1 : b[0] === "Date" ? 1 : a[0] < b[0] ? -1 : 1);
  rows.push([], ["Total recettes", "", "", "", "", r.ca, ""], ["Total dépenses", "", "", "", "", "", r.achats + r.charges]);
  return "﻿" + rows.map(l => l.map(v => { const t = String(v ?? ""); return /[;"\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; }).join(";")).join("\r\n");
}

/* ═══════════════ Fenêtres ═══════════════ */
function voucherText(v) { return `${S.bar.name}\nBON DE RELIQUAT ${v.number}\nClient : ${v.client_label}\nMontant dû : ${F(v.amount)}\nServeuse : ${staffName(v.waitress_id)}\nÉmis le : ${new Date(v.issued_at).toLocaleString("fr-FR")}\nCode de vérification : ${v.code}\nÀ présenter en caisse. Valable une seule fois.`; }
function vModal() {
  const m = V.modal; if (!m) return "";
  let c = "";
  if (m.type === "confirm") c = `<h2>${esc(m.title)}</h2><p style="margin:0">${esc(m.text)}</p><div class="row"><button class="btn ghost grow" data-a="close">Annuler</button><button class="btn grow ${m.danger ? "bad" : ""}" data-a="okModal">${esc(m.ok)}</button></div>`;
  if (m.type === "voucher") { const v = m.v;
    c = `<h2>Bon de reliquat</h2><div class="receipt printable"><div class="c"><b>${esc(S.bar.name)}</b>${S.bar.city ? `<br>${esc(S.bar.city)}` : ""}</div><hr><div class="c"><b>BON DE RELIQUAT</b><br>N° ${esc(v.number)}</div><hr>
      <div>Client : ${esc(v.client_label)}</div><div>Montant dû : <b>${F(v.amount)}</b></div><div>Serveuse : ${esc(staffName(v.waitress_id))}</div><div>Émis le : ${new Date(v.issued_at).toLocaleString("fr-FR")}</div><hr>
      <div class="c">Code de vérification</div><div class="k">${esc(v.code)}</div><div class="qr">${qrSvg("GESCOBAR:" + S.bar.code + ":" + v.code, 3)}</div>
      <div class="c" style="font-size:12px">À présenter en caisse avec ce code. Valable une seule fois.</div></div>
      ${v.status !== "active" ? `<div class="note bad">Ce bon est ${v.status === "used" ? "déjà utilisé" : "annulé"}.</div>` : ""}
      ${CFG.mode === "live" ? "" : `<p class="mu" style="margin:0">L’impression est disponible sur l’application en ligne (gescobar-cm.netlify.app), pas dans cette démo.</p>`}
      <div class="row">${CFG.mode === "live" ? `<button class="btn grow" data-a="print">Imprimer le bon</button>` : ""}<button class="btn soft grow" data-a="copyV">Copier le texte</button>
      <a class="btn soft grow" href="https://wa.me/?text=${encodeURIComponent(voucherText(v))}" target="_blank" rel="noopener">Envoyer par WhatsApp</a></div><button class="btn ghost" data-a="close">Fermer</button>`; }
  if (m.type === "summary") { const s = m.s || {};
    c = `<h2>Rapport du ${s.date ? dfr(s.date, { weekday: "long", day: "numeric", month: "long" }) : "jour"}</h2>
      <div class="list">${[["Ventes", F(s.ventes)], ["Tickets vendus", s.tickets], ["Annulés", s.annules], ["Espèces versées", F(s.especes_versees)], ["Monnaie rendue", F(s.monnaie_rendue)], ["Mobile Money", F(s.mobile_money)],
        ["Bons émis", F(s.bons_emis)], ["Espèces attendues", F(s.attendu)], ["Espèces comptées", F(s.compte)], ["Écart de caisse", `<b class="${s.ecart < 0 ? "bad-t" : s.ecart > 0 ? "ok-t" : ""}">${F(s.ecart)}</b>`]]
        .map(([l, v]) => `<div class="between" style="padding:6px 0"><span class="mu">${l}</span><span class="num">${v}</span></div>`).join("")}</div>
      <h3>Par serveuse</h3><div class="scroll"><table><tr><th>Serveuse</th><th>Ventes</th><th>Tickets</th><th>Corr.</th><th>Écart</th><th>Btl.</th></tr>
        ${(s.serveuses || []).map(w => `<tr><td>${esc(w.nom)}</td><td>${F(w.ventes)}</td><td>${w.tickets}</td><td>${w.corrections}</td><td class="${w.ecart_versements < 0 ? "bad-t" : ""}">${F(w.ecart_versements)}</td><td>${w.bouteilles_en_main}</td></tr>`).join("")}</table></div>
      <p class="mu" style="margin:0">Btl. : bouteilles encore en main au moment de la clôture.</p><button class="btn" data-a="close">Fermer</button>`; }
  if (m.type === "report") c = `${reportHtml(m.r)}<div class="row noprint">${CFG.mode === "live" ? `<button class="btn grow" data-a="printReport">Enregistrer en PDF ou imprimer</button>` : `<p class="mu" style="margin:0">Le PDF s’enregistre depuis l’application en ligne : bouton « Enregistrer en PDF », puis choisissez « Enregistrer au format PDF » comme imprimante.</p>`}<button class="btn ghost grow" data-a="close">Fermer</button></div>`;
  if (m.type === "inventory") { const r = m.r || {};
    c = `<h2>Inventaire enregistré</h2><p style="margin:0">${r.ecarts ? `${r.ecarts} produit(s) corrigé(s).` : "Aucun écart : le stock compté correspond."}</p>
      ${(r.details || []).length ? `<div class="scroll"><table><tr><th>Produit</th><th>Prévu</th><th>Compté</th><th>Écart</th></tr>${r.details.map(d => `<tr><td>${esc(d.produit)}</td><td>${d.attendu}</td><td>${d.compte}</td><td class="${d.ecart < 0 ? "bad-t" : "ok-t"}">${d.ecart > 0 ? "+" : ""}${d.ecart}</td></tr>`).join("")}</table></div>` : ""}
      ${r.manquant_valeur ? `<div class="note bad between"><span>Valeur des bouteilles manquantes</span><b class="num">${F(r.manquant_valeur)}</b></div>` : ""}<button class="btn" data-a="close">Fermer</button>`; }
  if (m.type === "poster") c = `<div class="poster printable"><div class="brandmark" style="font-size:30px">GesCo<span> Bar</span></div><h2 style="margin:8px 0">${esc(S.bar.name)}</h2>
      <p>Serveuses : scannez ce code avec l’appareil photo de votre téléphone pour ouvrir l’application de caisse.</p>
      <div class="qr" style="max-width:300px;margin:0 auto">${qrSvg(joinUrl(), 8)}</div><div class="code-big num">${esc(S.bar.code)}</div><p class="mu">${esc(APP_URL)}</p></div>
      <div class="row"><button class="btn grow" data-a="print">Imprimer</button><button class="btn ghost grow" data-a="close">Fermer</button></div>`;
  if (m.type === "welcome") c = `<h2>Votre bar est créé</h2><p style="margin:0">Donnez ce code à vos serveuses pour qu’elles se connectent :</p><div class="code-big num">${esc(m.code)}</div>
    <p class="mu" style="margin:0">Étapes suivantes : ajustez les prix dans l’onglet Stock, ajoutez vos serveuses dans l’onglet Équipe, puis remettez-leur leurs bouteilles.</p><button class="btn" data-a="close">Commencer</button>`;
  return `<div class="scrim" data-a="${m.type === "confirm" ? "close" : ""}" data-self="1"><div class="sheet" role="dialog" aria-modal="true">${c}</div></div>`;
}

/* ═══════════════ Rendu principal et événements ═══════════════ */
function render() {
  const ae = document.activeElement, fid = ae && ae.id, ss = ae && ae.selectionStart, se = ae && ae.selectionEnd;
  let html;
  if (V.screen === "boot") html = `<div class="empty"><span class="spin"></span></div>`;
  else if (V.screen === "login") html = vLogin();
  else if (!S) html = `<div class="empty"><span class="spin"></span> Chargement…</div>`;
  else html = (isCaisse() ? vCaisse() : vWaitress()) + bismo(true);
  $app.innerHTML = html + vModal() + (V.toast ? `<div class="toast ${V.toast.kind || ""}" role="status">${esc(V.toast.msg)}</div>` : "");
  if (fid) { const el = document.getElementById(fid); if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); try { if (ss != null) el.setSelectionRange(ss, se); } catch (e) {} } }
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  if (el.dataset.self && e.target !== el) return;
  const a = el.dataset.a; if (!a || !A[a]) return; if (el.tagName === "A") return;
  e.preventDefault(); A[a]({ ...el.dataset }, el);
});
document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.k; if (!k) return; V.f[k] = e.target.value;
  if (/^(rcv_|cnt$|q_)/.test(k)) { clearTimeout(window.__r); window.__r = setTimeout(render, k.startsWith("q_") ? 120 : 250); } });
document.addEventListener("change", e => { const t = e.target;
  if (t.id === "id_file") { window.__idFile = t.files && t.files[0] || null; render(); return; }
  if (t.id === "accm") { V.accMonth = t.value; V.acc = null; render(); A.loadAcc(); return; }
  if (t.dataset && t.dataset.k && t.tagName === "SELECT") { V.f[t.dataset.k] = t.value; render(); }
  if (t.dataset && t.dataset.qty) call("gb_ticket_set_qty", { p_ticket: t.dataset.t, p_product: t.dataset.p, p_qty: Math.max(0, Math.trunc(+t.value || 0)) }); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.enter) { e.preventDefault(); const a = e.target.dataset.enter; A[a] && A[a]({}); }
  if (e.key === "Escape" && V.modal) A.close(); });

addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.__install = e; render(); });
addEventListener("appinstalled", () => { window.__install = null; toast("Application installée sur l’écran d’accueil."); });
A.install = async () => { const e = window.__install; if (!e) return; e.prompt(); try { await e.userChoice; } catch (x) {} window.__install = null; render(); };
(async function boot() {
  let barParam = null; try { barParam = new URLSearchParams(location.search).get("bar"); } catch (e) {}
  if (barParam) { V.code = barParam.trim().toUpperCase(); LS.set("gesco-code", V.code); V.ltab = "staff";
    try { history.replaceState(null, "", location.pathname); } catch (e) {} }
  try { V.screen = (await B.init()) ? "app" : "login"; } catch (e) { V.screen = "login"; }
  if (V.screen === "app") await enterApp(); else { render(); if (barParam) A.loadStaff(); }
})();
</script>

<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});</script>
