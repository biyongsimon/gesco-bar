<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c3c">
<meta name="description" content="GesCo Bar : tickets par serveuse, caisse, stock et reliquats pour les bars et snacks.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>GesCo Bar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : une colonne tactile pour la serveuse, un tableau de bord à onglets pour la caisse.
   Couleurs : vert bouteille (marque), ambre bière (action), neutres légèrement verdis. */
:root{
  --bg:#f3f6f3; --surface:#ffffff; --sunk:#e9efea; --ink:#13201a; --muted:#5b6a62; --line:#dbe3dd;
  --brand:#0f5c3c; --brand-ink:#ffffff; --amber:#c98a12; --amber-soft:#fbf0d9;
  --ok:#17804a; --ok-soft:#e1f3e8; --warn:#a8650b; --warn-soft:#fbecd3; --bad:#b4302a; --bad-soft:#f8e1df;
  --shadow:0 1px 2px rgba(15,40,28,.06),0 4px 14px rgba(15,40,28,.06);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --logo-shadow:drop-shadow(0 1px 1.5px rgba(4,40,48,.35));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1411; --surface:#141f1a; --sunk:#0f1915; --ink:#e7efe9; --muted:#93a59b; --line:#25332c;
  --brand:#38b87a; --brand-ink:#06150e; --amber:#f0b43c; --amber-soft:#3a2c10;
  --ok:#4fd08b; --ok-soft:#123222; --warn:#f2b155; --warn-soft:#3a2a10; --bad:#ff7b72; --bad-soft:#3d1715;
  --shadow:0 1px 2px rgba(0,0,0,.4); --logo-shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1411; --surface:#141f1a; --sunk:#0f1915; --ink:#e7efe9; --muted:#93a59b; --line:#25332c;
  --brand:#38b87a; --brand-ink:#06150e; --amber:#f0b43c; --amber-soft:#3a2c10;
  --ok:#4fd08b; --ok-soft:#123222; --warn:#f2b155; --warn-soft:#3a2a10; --bad:#ff7b72; --bad-soft:#3d1715;
  --shadow:0 1px 2px rgba(0,0,0,.4); --logo-shadow:none; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:1080px;margin:0 auto;padding-block:12px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:20px;letter-spacing:-.01em}
h3{font-size:12px;font-family:var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.mu{color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1 1 160px;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.sub{background:var(--sunk);border-radius:10px;padding:10px 12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=tel],input:not([type]),select,textarea{
  width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.btn{min-height:46px;padding:10px 16px;border-radius:10px;border:1px solid transparent;background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.amber{background:var(--amber);color:#1d1404}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.bad{background:transparent;border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.amber{background:var(--amber-soft);color:var(--warn)}
.pill.brand{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:800 18px var(--display);flex:none}
.who>div>b{display:block;font-size:16px;line-height:1.2}
.brandmark{font:800 20px var(--display);letter-spacing:-.02em;color:var(--brand)}
.brandmark span{color:var(--amber)}

/* Indicateurs */
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.kpi .v{font:800 21px/1.15 var(--display);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi.hl{border-color:color-mix(in srgb,var(--amber) 60%,transparent);background:var(--amber-soft)}
.kpi.alert{border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:var(--bad-soft)}

/* Onglets */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:thin}
.tabs button{flex:none;min-height:40px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .dot{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;margin-left:6px}

/* Tickets */
.tk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.tk.open{border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.tk-h{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:58px;background:none;border:0;text-align:left;cursor:pointer}
.tk-h .nm{flex:1;min-width:0}
.tk-h .nm b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-h .tt{font:800 16px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{width:22px;height:22px;flex:none;color:var(--muted);transition:transform .15s}
.tk.open .chev{transform:rotate(90deg)}
.tk-b{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.prow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px}
.prow.on{background:color-mix(in srgb,var(--amber) 14%,transparent)}
.prow .pn{flex:1;min-width:0}
.prow .pn b{display:block;font-weight:600}
.cat{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:6px 8px 0}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:22px;font-weight:700;cursor:pointer;line-height:1}
.stepper button.plus{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.stepper input{width:52px;min-height:44px;text-align:center;padding:4px;font-weight:700}
.lines .ln{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:10px}
.total b{font:800 22px var(--display);font-variant-numeric:tabular-nums}
.bills{display:flex;gap:6px;flex-wrap:wrap}
.bills button{min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.bills button.on{border-color:var(--amber);background:var(--amber-soft)}
.note{border-radius:10px;padding:10px 12px;font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.info{background:var(--sunk);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:14px;background:var(--surface)}
.chip.owe{border-color:color-mix(in srgb,var(--warn) 60%,transparent);color:var(--warn);background:var(--warn-soft)}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:none;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.list>*+*{border-top:1px solid var(--line)}
.li{padding:10px 0;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.li .grow{flex:1 1 180px;min-width:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* Graphiques */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:14px;background:var(--sunk);border-radius:7px;overflow:hidden}
.bar .fl{height:100%;background:var(--brand);border-radius:7px}
.bar.cur .fl{background:var(--amber)}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px;border-bottom:1px solid var(--line)}
.cols div{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.cols div.cur{background:var(--amber);opacity:1}

/* Connexion */
.login{max-width:440px;margin:4vh auto 0;display:flex;flex-direction:column;gap:16px}
.hero{padding:6px 2px}
.hero .brandmark{font-size:34px}
.hero p{margin:6px 0 0;color:var(--muted)}
.who-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.who-pick button{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.who-pick button span{font-size:12px;color:var(--muted);font-weight:600}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:6px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots i.f{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:60px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:700 24px var(--display);cursor:pointer}
.pad button.k2{font:600 15px var(--body);color:var(--muted)}
.demo{border:1px dashed color-mix(in srgb,var(--amber) 70%,transparent);background:var(--amber-soft);border-radius:var(--r);padding:12px;font-size:14px}
.code-big{font:800 34px var(--display);letter-spacing:.12em;text-align:center;color:var(--brand)}

/* Fenêtres, messages */
.scrim{position:fixed;inset:0;background:rgba(5,12,9,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--surface);border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.receipt{background:#fff;color:#111;border-radius:10px;padding:16px;font:14px/1.5 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;border:1px dashed #999}
.receipt hr{border:0;border-top:1px dashed #999;margin:8px 0}
.receipt .c{text-align:center}
.receipt .k{font-size:24px;font-weight:800;letter-spacing:3px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(92vw,480px);padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.err{background:var(--bad);color:#fff}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.net i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.net.off i{background:var(--bad)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.qr svg{display:block;margin:6px auto;max-width:100%;height:auto}
/* Signature BISMO Agency : logo détouré, lisible sur les deux thèmes, apparition animée */
.bismo{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0}
.bismo small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bismo .lg{position:relative;width:min(220px,62vw);aspect-ratio:520/208}
.bismo.anim small{animation:fadeUp .6s calc(.55s - var(--el,0ms)) both}.bismo.anim .lg{animation:logoIn .9s cubic-bezier(.2,.8,.2,1) calc(0s - var(--el,0ms)) both}
.bismo .lg img{width:100%;height:100%;display:block;filter:var(--logo-shadow)}
.bismo .lg::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);background-size:250% 100%;
  -webkit-mask:var(--logo-mask) center/contain no-repeat;mask:var(--logo-mask) center/contain no-repeat;opacity:0}
.bismo.anim .lg::after{opacity:1;animation:shine 1.6s calc(.9s - var(--el,0ms)) ease-out both}
.bismo.mini{flex-direction:row;justify-content:center;gap:10px;margin:28px 0 4px}
.bismo.mini .lg{width:96px}.bismo.mini.anim .lg{animation:fadeUp .6s calc(.3s - var(--el,0ms)) both}.bismo.mini.anim .lg::after{animation:shine 2.2s calc(1s - var(--el,0ms)) ease-out both}
.bismo.mini small{letter-spacing:.08em}.bismo.mini.anim small{animation:fadeUp .6s calc(.2s - var(--el,0ms)) both}
@keyframes logoIn{from{opacity:0;transform:translateY(10px) scale(.92);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shine{from{background-position:120% 0}to{background-position:-30% 0}}
.bismo .lg img{animation:logoLive 6s ease-in-out infinite;animation-delay:var(--ph,0ms)}
.bismo:not(.anim) .lg::after{opacity:1;animation:shineLive 6s ease-in-out infinite;animation-delay:var(--ph,0ms)}
@keyframes logoLive{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-3px) scale(1.025) rotate(-.6deg)}50%{transform:translateY(0) scale(1)}75%{transform:translateY(-2px) scale(1.02) rotate(.6deg)}}
@keyframes shineLive{0%,40%{background-position:120% 0}75%,100%{background-position:-30% 0}}
.theme-btn{display:inline-flex;align-items:center;gap:6px}
.theme-btn svg{width:18px;height:18px}
.report{background:#fff;color:#111;border-radius:10px;padding:16px;font-size:13px}
.report h2{color:#111}.report table{font-size:12px}.report th,.report td{border-color:#ddd;color:#111}
.report .mu{color:#555}.report .kv{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:5px 0}
@media print{body.print-report #app>*:not(.scrim){display:none!important}body.print-report .scrim{position:static;background:none;padding:0;display:block}
  body.print-report .sheet{max-height:none;overflow:visible;max-width:none;padding:0}body.print-report .noprint{display:none!important}}
.receipt .qr{max-width:120px;margin:0 auto}
.poster{text-align:center}
@media print{body:not(.print-report) *{visibility:hidden}.printable,.printable *{visibility:visible}.printable{position:fixed;left:0;top:0;border:0;background:#fff;color:#000}
  .receipt.printable{width:58mm;padding:2mm}.poster.printable{width:100%;padding:12mm}}
/* ── v3 : cadre par rôle, menu, planning animé ── */
:root{--sky:#1f6fa8;--sky-soft:#e1eef8;--night:#5b3fa0;--night-soft:#ece6f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#6cb6ec;--sky-soft:#12283a;--night:#b9a2f5;--night-soft:#251b3d}}
:root[data-theme="dark"]{--sky:#6cb6ec;--sky-soft:#12283a;--night:#b9a2f5;--night-soft:#251b3d}
#app{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
.ico{width:20px;height:20px;flex:none}
.btn .ico{width:18px;height:18px;margin-right:6px}
.pill.sky{background:var(--sky-soft);color:var(--sky)}.pill.night{background:var(--night-soft);color:var(--night)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex-wrap:nowrap;margin:-12px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 6px calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.who>div>b,.who .mu{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{position:relative;width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.ib[disabled]{opacity:.4;cursor:default}
.bd{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px var(--body);font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--bg)}
@media (max-width:420px){.top .nt{display:none}}
.ptitle{margin:10px 0 14px}.ptitle h1{font-size:28px;letter-spacing:-.025em;line-height:1.1}.ptitle p{margin:3px 0 0}
.sec{animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(0ms - var(--el,0ms))}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms + 80ms - var(--el,0ms))}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes growX{from{transform:scaleX(0)}to{transform:none}}

.ntf{position:fixed;z-index:65;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:min(94vw,460px);display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;

.ntf-i{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sunk);color:var(--brand);animation:ring .9s .2s ease-in-out 2}

function installBox() {

  return `<p class="mu" style="margin:0;text-align:center">${ios ? "Pour l’installer : touchez Partager, puis « Sur l’écran d’accueil »." : "Pour l’installer : menu ⋮ de Chrome, puis « Ajouter à l’écran d’accueil »."}</p>`;
}

function kpi(l, v, cls, extra) { return `<div class="kpi ${cls || ""}"><div class="l">${l}</div><div class="v">${v}</div>${extra ? `<div class="mu">${extra}</div>` : ""}</div>`; }
function statusPill(t) {
  if (t.status === "draft") return `<span class="pill">Brouillon</span>`;
  if (t.status === "sent") return t.cancel_requested ? `<span class="pill bad">Annulation demandée</span>` : `<span class="pill brand">Envoyé</span>`;
  if (t.status === "cashed") return t.pay_method === "momo" ? `<span class="pill amber">MoMo à confirmer</span>` : `<span class="pill amber">Espèces à remettre</span>`;
  if (t.status === "paid") return t.change_status === "pending" ? `<span class="pill warn">Reliquat à rendre</span>` : `<span class="pill ok">Payé ✓</span>`;
  return `<span class="pill">Annulé</span>`;
}

function accFigures(r) {
  const marge = r.ca - r.cogs, resultat = marge - r.charges - r.pertes, treso = r.ca - r.achats - r.charges;

}

function accCsv(r) {
  const rows = [["Date", "Type", "Catégorie", "Détail", "Mode de paiement", "Recette (FCFA)", "Dépense (FCFA)"]];
  r.by_day.forEach(d => { if (d.cash) rows.push([d.day, "Recette", "Ventes", `${d.tickets} ticket(s)`, "Espèces", d.cash, ""]); if (d.momo) rows.push([d.day, "Recette", "Ventes", "", "Mobile Money", d.momo, ""]); });
  r.achats_detail.forEach(a => rows.push([a.day, "Dépense", "Achats de boissons", `${a.qty} × ${a.produit}`, "", "", a.total]));
  r.depenses.forEach(e => rows.push([e.day, "Dépense", e.category, e.label || "", { cash: "Espèces", momo: "Mobile Money", banque: "Banque" }[e.method] || "", "", e.amount]));
  rows.sort((a, b) => a[0] === "Date" ? -1 : b[0] === "Date" ? 1 : a[0] < b[0] ? -1 : 1);
  rows.push([], ["Total recettes", "", "", "", "", r.ca, ""], ["Total dépenses", "", "", "", "", "", r.achats + r.charges]);
  return "﻿" + rows.map(l => l.map(v => { const t = String(v ?? ""); return /[;"\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; }).join(";")).join("\r\n");
}

      <label class="f" for="sh_n">Note visible par l’employé (facultatif)<input id="sh_n" data-k="sh_n" value="${val("sh_n")}" placeholder="Ex. inventaire à 17 h"></label>
      <button class="tgl ${V.f.sh_all ? "on" : ""}" data-a="shAll" role="switch" aria-checked="${!!V.f.sh_all}"><i></i><span>Appliquer cet horaire du lundi au dimanche</span></button>
      <div class="row"><button class="btn grow" data-a="shiftSave" data-k="travail">Enregistrer l’horaire</button><button class="btn soft grow" data-a="shiftSave" data-k="repos">Jour de repos</button></div>
      <div class="row">${sh ? `<button class="btn bad sm" data-a="shiftSave" data-k="aucun">Effacer la case</button>` : ""}<span class="grow"></span><button class="btn ghost sm" data-a="close">Fermer</button></div>`; }
  if (m.type === "plan") c = `<h2>Planning de la semaine</h2>${m.url ? `<img class="planimg" src="${m.url}" alt="Planning de la semaine du ${dfr(wkStart(), { day: "numeric", month: "long" })}">` : `<div class="note bad">Image indisponible sur cet appareil.</div>`}
      <div class="row">${m.url ? `<button class="btn grow" data-a="planShare">${ico("share")} Partager l’image</button><button class="btn soft grow" data-a="planDl">${ico("dl")} Télécharger</button>` : ""}</div>
      <a class="btn soft wide" href="https://wa.me/?text=${encodeURIComponent(planText())}" target="_blank" rel="noopener">Envoyer le planning en texte sur WhatsApp</a>
      <p class="mu" style="margin:0">Sur téléphone, « Partager l’image » ouvre la liste des applications : choisissez WhatsApp puis le groupe de l’équipe.</p><button class="btn ghost" data-a="close">Fermer</button>`;
  if (m.type === "avisAsk") return `<div class="scrim" data-self="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="Donner mon avis">${vAvisAsk()}</div></div>`;
  if (m.type === "avis") return `<div class="scrim" data-a="close" data-self="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="Donner mon avis">${vAvis()}</div></div>`;
  if (m.type === "help") return `<div class="scrim help-scrim" data-a="close" data-self="1"><div class="sheet helpsheet" role="dialog" aria-modal="true" aria-label="Aide">${vHelp()}</div></div>`;
  if (m.type === "subRecu") { const x = (S.subs || []).find(y => y.id === m.id) || {}, P = S.platform || {};
    const txt = `REÇU D’ABONNEMENT GESCO BAR\n${S.bar.legal_name || S.bar.name}\nFormule : ${(PLANS[x.plan] || [""])[0]} · ${x.months} mois\nMontant : ${F(x.amount)}\nPayé le ${new Date(x.created_at).toLocaleDateString("fr-FR")} par ${x.method === "orange" ? "Orange Money" : "MTN MoMo"}\nRéférence : ${x.reference}\nBISMO Agency`;
    c = `<div class="slip printable"><div class="between" style="align-items:flex-start"><div><b style="font-size:16px">BISMO Agency</b><div>Ngousso, Yaoundé</div><div>${esc(P.holder_name || "")}</div></div><img src="${LOGO}" alt="BISMO Agency" style="width:84px"></div>
      <h2 style="margin:14px 0 2px">Reçu d’abonnement GesCo Bar</h2><div>${esc(S.bar.legal_name || S.bar.name)}${S.bar.niu ? " · NIU " + esc(S.bar.niu) : ""}</div><hr>
      <div class="kv"><span>Formule</span><span>${(PLANS[x.plan] || [""])[0]} · ${x.months} mois</span></div><div class="kv"><span>Mode</span><span>${x.method === "orange" ? "Orange Money" : "MTN MoMo"}</span></div>
      <div class="kv"><span>Référence</span><span>${esc(x.reference || "")}</span></div><div class="kv"><span>Date</span><span>${new Date(x.created_at).toLocaleDateString("fr-FR")}</span></div><hr>
      <div class="kv"><b>Montant payé</b><b>${F(x.amount)}</b></div></div>
      <div class="row">${CFG.mode === "live" ? `<button class="btn grow" data-a="print">Imprimer</button>` : ""}<a class="btn soft grow" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Envoyer par WhatsApp</a></div><button class="btn ghost" data-a="close">Fermer</button>`; }
  if (m.type === "slip") { const p = (S.payroll || []).find(x => x.id === m.id);
    if (!p) c = `<h2>Fiche introuvable</h2><button class="btn" data-a="close">Fermer</button>`;
    else { const x = S.staff.find(y => y.id === p.staff_id) || { name: "—", role: "" }, kv = (l, v, b) => `<div class="kv"><span>${b ? `<b>${l}</b>` : l}</span>${b ? `<b>${v}</b>` : `<span>${v}</span>`}</div>`;
      c = `<div class="slip printable"><div class="between" style="align-items:flex-start"><div><b style="font-size:16px">${esc(S.bar.legal_name || S.bar.name)}</b>${S.bar.city ? `<div>${esc(S.bar.city)}</div>` : ""}${S.bar.niu ? `<div>NIU ${esc(S.bar.niu)}</div>` : ""}</div><img src="${LOGO}" alt="BISMO Agency" style="width:84px"></div>
        <h2 style="margin:14px 0 2px">Fiche de paie · ${monthName(p.month)}</h2><div>${esc(x.name)} · ${ROLES[x.role] || ""}</div><hr>
        ${kv("Salaire de base", F(p.base))}${kv("Prime", "+ " + F(p.bonus))}${kv("Retenue", "− " + F(p.deduction))}<hr>${kv("Net payé", F(p.net), 1)}
        ${kv("Mode de paiement", METH[p.method])}${kv("Date du paiement", new Date(p.paid_at).toLocaleDateString("fr-FR"))}${p.note ? kv("Note", esc(p.note)) : ""}
        <p style="font-size:11px;margin:12px 0 0;color:#555">Document généré par GesCo Bar. Signature de l’employé : ______________</p></div>
        <div class="row">${CFG.mode === "live" ? `<button class="btn grow" data-a="print">Imprimer</button>` : ""}<a class="btn soft grow" href="https://wa.me/?text=${encodeURIComponent(slipText(p, x))}" target="_blank" rel="noopener">Envoyer par WhatsApp</a></div><button class="btn ghost" data-a="close">Fermer</button>`; } }
  return `<div class="scrim" data-a="${m.type === "confirm" ? "close" : ""}" data-self="1"><div class="sheet" role="dialog" aria-modal="true">${c}</div></div>`;
}

/* ═══════════════ Rendu principal et événements ═══════════════ */
function render() {
  const ae = document.activeElement, fid = ae && ae.id, ss = ae && ae.selectionStart, se = ae && ae.selectionEnd;
  let html;
  if (V.screen === "boot") html = `<div class="empty"><span class="spin"></span></div>`;
  else if (V.screen === "login") html = vLogin();
  else if (!S) html = `<div class="empty"><span class="spin"></span> Chargement…</div>`;
  else if (V.locked) html = vLock() + bismo(true);
  else html = vApp() + bismo(true);
  const nt = V.screen === "app" && V.ntf ? `<div class="ntf ${V.ntf.kind}" role="alert" data-a="ntfClose"><span class="ntf-i">${ico({ order: "orders", ok: "check", staff: "clock" }[V.ntf.kind] || "alert")}</span><span class="grow"><b>${esc(V.ntf.title)}</b><small>${esc(V.ntf.body)}</small></span></div>` : "";
  $app.innerHTML = html + nt + vModal() + (V.toast ? `<div class="toast ${V.toast.kind || ""}" role="status">${esc(V.toast.msg)}</div>` : "");
  if (fid) { const el = document.getElementById(fid); if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); try { if (ss != null) el.setSelectionRange(ss, se); } catch (e) {} } }
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  if (el.dataset.self && e.target !== el) return;
  const a = el.dataset.a; if (!a || !A[a]) return; if (el.tagName === "A") return;
  e.preventDefault(); A[a]({ ...el.dataset }, el);
});
document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.k; if (!k) return; V.f[k] = e.target.value;
  if (/^(rcv_|cnt$|q_|gq$|pb_|pd_|qr_amt$)/.test(k)) { clearTimeout(window.__r); window.__r = setTimeout(render, /^(q_|gq)/.test(k) ? 120 : 250); } });
document.addEventListener("change", e => { const t = e.target;
  if (t.id === "id_file") { window.__idFile = t.files && t.files[0] || null; render(); return; }
  if (t.id === "ab_file") { window.__abFile = t.files && t.files[0] || null; render(); return; }
  if (t.id === "accm") { V.accMonth = t.value; V.acc = null; render(); A.loadAcc(); return; }
  if (t.id === "mo") { V.f.mo = t.value; V.stats = null; render(); A.loadStats(); return; }
  if (t.id === "pd") { V.f.pd = t.value > today() ? today() : t.value; render(); return; }
  if (t.dataset && t.dataset.k && t.tagName === "SELECT") { V.f[t.dataset.k] = t.value; render(); }
  if (t.dataset && t.dataset.qty) call("gb_ticket_set_qty", { p_ticket: t.dataset.t, p_product: t.dataset.p, p_qty: Math.max(0, Math.trunc(+t.value || 0)) }); });
document.addEventListener("keydown", e => { if (V.locked) { if (/^\d$/.test(e.key)) A.lkKey({ k: e.key }); else if (e.key === "Backspace") A.lkKey({ k: "del" }); else if (e.key === "Enter") A.lkGo(); return; }
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.enter) { e.preventDefault(); const a = e.target.dataset.enter; A[a] && A[a]({}); }
  if (e.key === "Escape") { if (V.modal) A.close(); else if (V.menu) A.menuClose(); } });

addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.__install = e; render(); });
addEventListener("appinstalled", () => { window.__install = null; toast("Application installée sur l’écran d’accueil."); });
A.install = async () => { const e = window.__install; if (!e) return; e.prompt(); try { await e.userChoice; } catch (x) {} window.__install = null; render(); };
if (/\.netlify\.app$/.test(location.hostname)) document.body.classList.add("hb"); // place réservée au badge de l’hébergeur
(async function boot() {
  let barParam = null; try { barParam = new URLSearchParams(location.search).get("bar"); } catch (e) {}
  if (barParam) { V.code = barParam.trim().toUpperCase(); LS.set("gesco-code", V.code); V.ltab = "staff";
    try { history.replaceState(null, "", location.pathname); } catch (e) {} }
  try { V.screen = (await B.init()) ? "app" : "login"; } catch (e) { V.screen = "login"; }
  if (V.screen === "app") await enterApp(); else { render(); if (barParam) A.loadStaff(); }
})();
</script>

<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
