<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#060b09">
<title>Console GesCo Bar</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="console.webmanifest">
<link rel="apple-touch-icon" href="console-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GesCo Console">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Console GesCo — sombre par défaut (ambiance bar de nuit), thème clair au choix */
:root{--bg:#060b09;--glow1:rgba(47,211,138,.12);--glow2:rgba(20,184,200,.09);--surface:#0c1511;--surface-2:#101b16;--glass:rgba(9,16,13,.78);--sunk:#14211b;--ink:#ebf4ef;--muted:#8aa096;--line:#1a2a22;--line-2:#25382f;
  --brand:#2fd38a;--brand-2:#16b9c9;--brand-ink:#03140b;--gold:#f6b94a;--av-l:72%;--on-ok:#03140b;--on-bad:#2a0605;
  --ok:#4fd890;--ok-soft:rgba(79,216,144,.13);--warn:#f4b64e;--warn-soft:rgba(244,182,78,.13);--bad:#ff7a72;--bad-soft:rgba(255,122,114,.13);--sky:#6cbcf0;--sky-soft:rgba(108,188,240,.13);--night:#b9a2f5;--night-soft:rgba(185,162,245,.14);
  --shadow:0 18px 40px -24px rgba(0,0,0,.85);--display:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
:root[data-theme="light"]{--bg:#f2f6f4;--glow1:rgba(15,122,79,.09);--glow2:rgba(14,127,154,.07);--surface:#fff;--surface-2:#f8fbf9;--glass:rgba(255,255,255,.82);--sunk:#edf3f0;--ink:#0e1913;--muted:#5b6d64;--line:#e0e8e3;--line-2:#cfdad4;
  --brand:#0f7a4f;--brand-2:#0e7f9a;--brand-ink:#fff;--gold:#b7791f;--av-l:36%;--on-ok:#fff;--on-bad:#fff;
  --ok:#15803d;--ok-soft:#dcf4e5;--warn:#9a5b00;--warn-soft:#fdf0d5;--bad:#c0262d;--bad-soft:#fde4e3;--sky:#1d6fa8;--sky-soft:#e1eef8;--night:#5b3fa0;--night-soft:#ece6f8;--shadow:0 16px 36px -24px rgba(15,40,28,.4);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(900px 520px at 100% -8%,var(--glow1),transparent 62%),radial-gradient(760px 480px at -12% 108%,var(--glow2),transparent 60%)}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h3{font:700 12px/1.3 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
input,select,textarea{width:100%;min-height:46px;padding:11px 13px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface-2);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 22%,transparent)}
textarea{resize:vertical;min-height:80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:14px;border:1px solid transparent;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--brand-ink);font-weight:700;cursor:pointer;box-shadow:0 10px 24px -14px var(--brand);transition:transform .12s,filter .15s;text-decoration:none}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.98)}
.btn.soft{background:var(--sunk);color:var(--ink);border-color:var(--line-2);box-shadow:none}
.btn.bad{background:var(--bad);color:var(--on-bad);box-shadow:none}.btn.ok{background:var(--ok);color:var(--on-ok);box-shadow:none}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.5;cursor:default}
.lnk{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:6px 4px}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;flex:none;padding:0}
.mu{color:var(--muted)}.num{font-variant-numeric:tabular-nums}
.cur{font-size:.5em;font-weight:700;margin-left:.3em;opacity:.7;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.sky{background:var(--sky-soft);color:var(--sky)}.pill.night{background:var(--night-soft);color:var(--night)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1 1 auto;min-width:0}.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;min-width:0;box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
code{font-size:.9em;padding:1px 6px;border-radius:6px;background:var(--sunk)}
hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.badge{display:inline-block;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#ef4444;color:#fff;font:700 11px/20px var(--body);text-align:center;font-style:normal;margin-left:auto;box-shadow:0 0 0 2px var(--surface)}
.av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font:800 16px var(--display);flex:none;background:hsl(var(--h,150) 60% 50% / .16);color:hsl(var(--h,150) 62% var(--av-l))}
.tic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--c-soft,var(--sunk));color:var(--c,var(--muted))}
.mk{width:44px;height:44px;border-radius:14px;flex:none}
/* connexion et verrouillage */
.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth .card{width:min(420px,100%);padding:28px 24px;display:flex;flex-direction:column;gap:14px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.auth .mk{width:68px;height:68px;border-radius:20px;margin:0 auto;box-shadow:0 18px 40px -16px var(--brand)}
.auth .bismo{width:96px;margin:4px auto 0;opacity:.85}
.err{padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-weight:600}
.lock{align-items:center;text-align:center}
.lock .av{width:72px;height:72px;border-radius:24px;font-size:30px;margin:0 auto 6px}
.dots{display:flex;justify-content:center;gap:16px;margin:8px 0 6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
.dots i.on{background:var(--brand);border-color:var(--brand);box-shadow:0 0 14px var(--brand);transform:scale(1.12)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:300px;margin:4px auto}
.kp button{position:relative;height:64px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2);font:700 24px var(--display);cursor:pointer;touch-action:manipulation;overflow:hidden;color:var(--ink)}
.kp button:active{background:var(--sunk)}
.kp button.ghost{border:0;background:none;color:var(--muted);display:grid;place-items:center}.kp button.ghost svg{width:26px;height:26px}
.kp button::after{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,#ff4d4d,#ffb84d,#fff04d,#4dff88,#4dd2ff,#9b6bff,#ff4dd2,#ff4d4d);opacity:0;pointer-events:none;border-radius:50%}
.kp button.zap::after{animation:zap .5s ease-out}
@keyframes zap{0%{opacity:.6;transform:scale(.3) rotate(0)}100%{opacity:0;transform:scale(1.2) rotate(120deg)}}
/* coque */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}.col{min-width:0}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}.brand b{display:block;font:800 18px/1.1 var(--display)}.brand small{font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;color:var(--muted);text-decoration:none;font-weight:600;transition:background .15s,color .15s}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a.on{color:var(--ink);background:linear-gradient(90deg,color-mix(in srgb,var(--brand) 20%,transparent),color-mix(in srgb,var(--brand) 4%,transparent))}
.nav a.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav a.on svg{color:var(--brand)}
.side-inst{display:flex;align-items:center;gap:10px;margin-top:14px;padding:11px 12px;border-radius:13px;border:1px dashed color-mix(in srgb,var(--gold) 55%,var(--line));background:color-mix(in srgb,var(--gold) 8%,transparent);color:var(--gold);font-weight:700;cursor:pointer;text-align:left}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.me b{display:block;font-size:14px}.me small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .ib{width:36px;height:36px;border-radius:11px}
.top{display:none}
main{padding-block:28px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1240px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}.ph h1{font-size:clamp(26px,4vw,32px)}.ph p{margin:4px 0 0;color:var(--muted);max-width:68ch}
/* accueil */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:24px 22px 22px;color:#fff;background:linear-gradient(135deg,#0b7048 0%,#0a5a62 52%,#122f48 100%);box-shadow:0 24px 50px -28px rgba(10,112,72,.9);margin-bottom:16px;isolation:isolate}
.hero::before{content:"";position:absolute;width:360px;height:360px;right:-110px;top:-170px;border-radius:50%;background:radial-gradient(closest-side,rgba(78,240,166,.55),transparent);z-index:-1;animation:float 9s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;width:300px;height:300px;left:-120px;bottom:-190px;border-radius:50%;background:radial-gradient(closest-side,rgba(246,185,74,.38),transparent);z-index:-1;animation:float 11s ease-in-out infinite alternate-reverse}
@keyframes float{to{transform:translate(-30px,24px) scale(1.1)}}
.hre{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.hero .hi{font-size:14px;color:rgba(255,255,255,.82)}
.hero .lab{margin-top:16px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.7);font-weight:700}
.hero .big{font:800 clamp(34px,8vw,52px)/1.05 var(--display);letter-spacing:-.03em;margin-top:4px}
.hero .hsub{color:rgba(255,255,255,.85);font-size:14px;margin-top:6px}
.gls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.gl{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);font-size:13px;font-weight:600;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.gl svg{width:15px;height:15px}
.hspark{position:absolute;right:0;bottom:0;width:58%;height:90px;z-index:-1;opacity:.9}
.inst{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;margin-bottom:16px;border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 13%,var(--surface)),var(--surface))}
.inst .btn{flex:none;white-space:nowrap}.inst b{display:block}.inst small{display:block;color:var(--muted);font-size:13px}
.dash{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.todo a{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:16px;color:inherit;text-decoration:none;transition:background .15s}
.todo a:hover{background:var(--sunk)}.todo a b{display:block}.todo a small{display:block;color:var(--muted);font-size:13px}
.todo .n{font:800 22px var(--display);color:var(--c)}
.todo .chev{color:var(--muted);width:18px;height:18px}
.allgood{display:flex;align-items:center;gap:12px;padding:6px 4px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;overflow:hidden;box-shadow:var(--shadow)}
.fresh .kpi{animation:rise .45s both;animation-delay:calc(var(--i,0)*50ms)}
.kpi .tic{width:38px;height:38px;border-radius:12px;margin-bottom:12px}
.kpi .lb{display:block;font-size:13px;color:var(--muted);font-weight:600}
.kpi b{display:block;font:800 24px/1.15 var(--display);margin-top:2px;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px}
.chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:12px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;font-size:12px;color:var(--muted);height:100%;min-width:0}
.chart i{display:block;width:100%;max-width:42px;border-radius:12px 12px 5px 5px;background:linear-gradient(to top,var(--brand-2),var(--brand));min-height:6px;transform-origin:bottom;box-shadow:0 10px 22px -12px var(--brand)}
.fresh .chart i{animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.chart div.z i{background:var(--sunk);box-shadow:none}
.chart b{color:var(--ink);font-size:13px}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.rk{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:16px;cursor:pointer;transition:background .15s}.rk:hover{background:var(--sunk)}
.rk .meter{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:7px}.rk .meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.rk .amt{text-align:right;font-weight:700;white-space:nowrap}.rk .amt small{display:block;color:var(--muted);font-weight:500;font-size:12px}
/* tableaux (deviennent des fiches sur téléphone) */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
.cell{display:flex;align-items:center;gap:12px;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chip b{margin-left:4px}
.search{position:relative;max-width:340px;width:100%}.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}.search input{padding-left:40px}
/* journal */
.tl-day{font:700 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 4px 8px}
.tl-day:first-child{margin-top:0}
.tl{display:flex;gap:12px;padding:12px 4px;align-items:flex-start}
.tl+.tl{border-top:1px solid var(--line)}
.tl .tic{width:38px;height:38px;border-radius:12px}
.tl .d{font-size:13px;color:var(--muted);overflow-wrap:anywhere;margin-top:2px}
.tl time{font-size:12px;color:var(--muted);white-space:nowrap}
/* paiements, fiche bar, assistance, avis */
.pay{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:start}
.pay img,.pay .noimg{width:100%;border-radius:14px;border:1px solid var(--line);background:var(--sunk);aspect-ratio:3/4;object-fit:cover}
.pay .noimg{display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border:0}
.scrim{position:fixed;inset:0;background:rgba(3,8,6,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;display:flex;justify-content:flex-end}
.panel{width:min(540px,100%);height:100%;overflow:auto;background:var(--bg);padding:22px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) 22px;display:flex;flex-direction:column;gap:14px;animation:slide .28s cubic-bezier(.2,.8,.2,1) both;border-left:1px solid var(--line)}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;z-index:80;max-width:min(92vw,520px);box-shadow:0 18px 40px -16px rgba(0,0,0,.6);animation:pop .25s both}
.toast.err{background:var(--bad);color:var(--on-bad)}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.empty{padding:24px;text-align:center;color:var(--muted)}
.stz{color:#f5b301;letter-spacing:2px;font-size:18px}.stz i{font-style:normal;color:var(--line-2)}
.bar-h{flex:1;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}.bar-h i{display:block;height:100%;background:#f5b301;border-radius:99px}
.sup{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.supl{padding:6px;display:flex;flex-direction:column;gap:4px;max-height:72vh;overflow:auto}
.supi{display:flex;flex-direction:column;gap:3px;text-align:left;border:0;background:none;padding:11px 12px;border-radius:14px;cursor:pointer}
.supi:hover{background:var(--sunk)}.supi.on{background:var(--sunk);box-shadow:inset 3px 0 0 var(--brand)}
.supd{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slog{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding:4px 2px}
.sm{max-width:85%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.45;overflow-wrap:anywhere}.sm small{display:block;font-size:11px;font-weight:700;opacity:.75;margin-bottom:2px}
.sm.client{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:5px}.sm.ia{align-self:flex-end;background:color-mix(in srgb,var(--brand) 12%,var(--surface));border:1px solid var(--line);border-bottom-right-radius:5px}

const val = id => { if (V.snap && id in V.snap) return String(V.snap[id]).trim(); const e = document.getElementById(id); return e ? e.value.trim() : ""; };
let armed = null; function confirmTwice(id) { if (armed === id) { armed = null; return true; } armed = id; toast("Touchez encore « Suspendre l’accès » pour confirmer : toute l’équipe du bar sera bloquée.", "err"); setTimeout(() => { if (armed === id) armed = null; }, 6000); return false; }
document.addEventListener("click", e => { const el = e.target.closest("[data-a]"); if (!el) return; if (el.dataset.self && e.target !== el) return; e.preventDefault(); const f = A[el.dataset.a]; if (f) f({ ...el.dataset }, el); });

document.addEventListener("keydown", e => { const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName), key = k => document.querySelector(`.kp [data-v="${k}"]`);
  const padAct = V.view === "relock" && qpin() && V.lkMode !== "pw" ? "lk" : V.sheet === "qp" && V.qp ? "qk" : null;
  if (padAct && !typing && (/^\d$/.test(e.key) || e.key === "Backspace")) { e.preventDefault(); const v = e.key === "Backspace" ? "del" : e.key; A[padAct]({ v }, key(v)); return; }
  if (e.key === "Escape" && V.sheet) { A.shClose(); return; }
  if (e.key === "Enter" && V.view === "relock") { e.preventDefault(); A.unlock(); return; }
  if (e.key === "Enter" && V.view === "login") { e.preventDefault(); A[V.setup && V.f.mode !== "login" ? "setup" : "login"](); } if (e.key === "Escape" && V.panel) A.close(); });
addEventListener("hashchange", () => { V.tab = location.hash.slice(1) || "apercu"; V.panel = null; V.sheet = null; render(); scrollTo(0, 0); });
try { const t = localStorage.getItem("gesco-console-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
function themeMeta() { const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = isDark() ? "#060b09" : "#f2f6f4"; } themeMeta();
/* Verrouillage après 1 minute d'inactivité : mot de passe à retaper */
let lastAct = Date.now();
["pointerdown", "keydown", "touchstart", "wheel", "scroll"].forEach(ev => addEventListener(ev, () => { if (V.view === "app") lastAct = Date.now(); }, { passive: true, capture: true }));
const lockIfIdle = auto => { if (V.view === "app" && Date.now() - lastAct > 60000) { V.view = "relock"; V.panel = null; V.sheet = null; V.qp = null; V.err = ""; V.lk = ""; V.lkMode = ""; render(); if (auto && bio() && qpin()) setTimeout(A.bio, 350); } };
setInterval(lockIfIdle, 5000);
async function loadMsgs(id) { const { data } = await sb.from("support_messages").select("*").eq("thread_id", id).order("id"); if (V.thr === id) V.msgs = data || []; }
/* Nouvelles demandes d'assistance : vérification toutes les 30 s + signal sonore */
let supSeen = null;
setInterval(async () => { if (V.view !== "app" || document.visibilityState !== "visible") return;
  try { const sup = await rpc("gb_pf_support_list"), n = sup.filter(supNew).length, sig = sup.map(t => t.id + t.last_msg_at).join();
    if (sig === (V.data.sup || []).map(t => t.id + t.last_msg_at).join()) return;
    V.data.sup = sup; if (V.thr) await loadMsgs(V.thr);
    if (supSeen != null && n > supSeen) { toast("Nouvelle demande d’assistance transmise par l’IA."); try { const c = new AudioContext(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.setValueAtTime(.15, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .5); o.start(); o.stop(c.currentTime + .5); } catch (e) {} }
    supSeen = n; if (!V.busy) render(); } catch (e) {} }, 30000); document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") lockIfIdle(true); });

  if (error) { V.err = "Mot de passe incorrect."; return; } const p = lsGet(QK); if (p && p.u === V.me) { p.n = 0; lsSet(QK, p); }
  V.view = "app"; V.lkMode = ""; lastAct = Date.now(); if (V.loadP) { await V.loadP; V.loadP = null; } await loadAll(); offerQp(); });
